<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MiniOS Ultimate</title>

<!-- IMPORTANT: ensures CSS loads -->
<link rel="stylesheet" href="style.css">

<!-- IMPORTANT: ensures JS loads AFTER DOM parsing -->
<script defer src="script.js"></script>
</head>

<body>

<!-- ROOT DESKTOP (your JS depends on this) -->
<div id="desktop"></div>

<!-- SIMPLE CONTROL BAR (GUARANTEED TRIGGER POINTS) -->
<div id="taskbar">

    <!-- These must exist so YOU can trigger functions manually -->
    <button onclick="openBrowser()">Open Browser</button>
    <button onclick="openAI()">Open AI</button>

</div>

</body>
</html>
