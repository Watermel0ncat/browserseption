<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MiniOS Ultimate</title>
<link rel="stylesheet" href="style.css">
<script defer src="script.js"></script>
</head>

<body>

<div id="desktop"></div>

<div id="taskbar">
    <div id="taskApps"></div>
</div>

<!-- TEMPLATES -->

<div class="window hidden template" id="browserTemplate">
    <div class="titlebar">
        <span>Browser</span>
        <button class="min">_</button>
        <button class="close">x</button>
    </div>
    <input class="url">
    <button class="go">Go</button>
    <iframe class="frame"></iframe>
</div>

<div class="window hidden template" id="aiTemplate">
    <div class="titlebar">
        <span>AI</span>
        <button class="min">_</button>
        <button class="close">x</button>
    </div>
    <input class="aiInput">
    <button class="ask">Ask</button>
    <div class="aiOutput"></div>
</div>

</body>
</html>
